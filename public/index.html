<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspot Signup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .msg {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .error { color: #d9534f; }
        .success { color: #28a745; }
    </style>
</head>
<body>

<div class="card">
    <h2>হটস্পট সাইন আপ</h2>
    <form id="signupForm">
        <div class="form-group">
            <label>ইউজারনেম / মোবাইল নম্বর</label>
            <input type="text" id="username" required placeholder="017xxxxxxxx">
        </div>
        <div class="form-group">
            <label>পাসওয়ার্ড</label>
            <input type="password" id="password" required placeholder="পাসওয়ার্ড দিন">
        </div>
        <button type="submit" id="btn">অ্যাকাউন্ট তৈরি করুন</button>
    </form>
    <div id="statusMsg" class="msg"></div>
</div>

<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const msg = document.getElementById('statusMsg');

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    btn.disabled = true;
    btn.innerText = 'অপেক্ষা করুন...';
    msg.className = 'msg';
    msg.innerText = '';

    try {
        // কোনো হার্ডকোড ডোমেইন ছাড়া সরাসরি রিলেটিভ পাথে কল হচ্ছে
        const res = await fetch('/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
            msg.className = 'msg success';
            msg.innerText = data.message;
            document.getElementById('signupForm').reset();
        } else {
            msg.className = 'msg error';
            msg.innerText = data.message || 'ব্যর্থ হয়েছে!';
        }
    } catch (err) {
        msg.className = 'msg error';
        msg.innerText = 'সার্ভারে সংযোগ করা সম্ভব হচ্ছে না। পুনরায় চেষ্টা করুন।';
    } finally {
        btn.disabled = false;
        btn.innerText = 'অ্যাকাউন্ট তৈরি করুন';
    }
});
</script>

</body>
</html>
