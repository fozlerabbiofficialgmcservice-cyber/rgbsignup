<form id="signupForm">
    <div>
        <label>Mobile Number</label>
        <input type="text" id="username" placeholder="01XXXXXXXXX" required>
    </div>

    <div>
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
    </div>

    <div>
        <label>Transaction ID</label>
        <input type="text" id="trxid" placeholder="Enter TrxID" required>
    </div>

    <button type="button" onclick="handleSignup()">SIGN UP</button>
</form>

<script>
async function handleSignup() {
    // সঠিক id অনুযায়ী ভ্যালু নেওয়া
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const trxid = document.getElementById('trxid').value.trim();

    if (!username || !password) {
        alert("ইউজারনেম ও পাসওয়ার্ড দেওয়া বাধ্যতামূলক।");
        return;
    }

    if (!trxid) {
        alert("ট্রানজেকশন আইডি দেওয়া বাধ্যতামূলক।");
        return;
    }

    // ব্যাকএন্ড API-তে ডাটা পাঠানো
    try {
        const response = await fetch('/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, trxid })
        });
        const data = await response.json();
        alert(data.message || "প্রক্রিয়া সম্পন্ন হয়েছে");
    } catch (err) {
        alert("সার্ভারে সংযোগ করা যাচ্ছে না!");
    }
}
</script>
