<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Premium Portal Signup</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* RGB Animated Border Container */
        .card-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            padding: 3px;
            background: linear-gradient(60deg, #f79533, #f37055, #ef4e7b, #a166ab, #5073b8, #1098ad, #07b39b, #6fba82);
            background-size: 300% 300%;
            animation: rgbGlow 6s ease infinite;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        @keyframes rgbGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-content {
            background: #111827;
            padding: 30px 25px;
            border-radius: 18px;
            color: #fff;
        }

        .header-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            color: #00f2fe;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        /* Payment Badge Box */
        .payment-info {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.6;
        }

        .payment-info b {
            color: #38bdf8;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #9ca3af;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0b0f19;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }

        .status-msg {
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card-content">
        <h2 class="header-title">PORTAL SIGN UP</h2>

        <!-- পেমেন্ট নির্দেশনা -->
        <div class="payment-info">
            📌 <b>বিকাশ / নগদ (Send Money):</b> <span style="color:#f59e0b;">01XXXXXXXXX</span><br>
            টাকা পাঠিয়ে প্রাপ্ত TrxID নিচে প্রদান করুন। যাচাইয়ের পর স্বয়ংক্রিয়ভাবে নেট সক্রিয় হবে।
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label for="username">মোবাইল নম্বর (ইউজারনেম)</label>
                <input type="text" id="username" placeholder="01XXXXXXXXX" required>
            </div>

            <div class="form-group">
                <label for="password">পাসওয়ার্ড</label>
                <input type="password" id="password" placeholder="গোপন পাসওয়ার্ড দিন" required>
            </div>

            <div class="form-group">
                <label for="trxid">ট্রানজেকশন আইডি (TrxID)</label>
                <input type="text" id="trxid" placeholder="উদাহরণ: BK123456" required>
            </div>

            <button type="button" class="submit-btn" id="btnSubmit" onclick="submitPortal()">SIGN UP</button>
        </form>

        <p class="status-msg">After signing up, your payment will be verified.</p>
    </div>
</div>

<script>
async function submitPortal() {
    const userField = document.getElementById('username');
    const passField = document.getElementById('password');
    const trxField = document.getElementById('trxid');
    const btn = document.getElementById('btnSubmit');

    const username = userField.value.trim();
    const password = passField.value.trim();
    const trxid = trxField.value.trim();

    if (!username || !password) {
        alert("মোবাইল নম্বর ও পাসওয়ার্ড দেওয়া বাধ্যতামূলক।");
        return;
    }

    if (!trxid) {
        alert("ট্রানজেকশন আইডি দেওয়া বাধ্যতামূলক।");
        return;
    }

    btn.innerText = "ভেরিফাই হচ্ছে...";
    btn.disabled = true;

    try {
        // Render ব্যাকএন্ড এন্ডপয়েন্ট কল
        const response = await fetch('/signup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                phone: username,
                username: username,
                password: password,
                trxid: trxid
            })
        });

        const result = await response.json();

        if (response.ok) {
            alert(result.message || "সাইন আপ সফল হয়েছে! এখন হটস্পটে লগইন করতে পারবেন।");
        } else {
            alert(result.error || result.message || "ভেরিফিকেশন ব্যর্থ হয়েছে। TrxID সঠিক কি না পরীক্ষা করুন।");
        }
    } catch (err) {
        alert("সার্ভারে সংযোগ করা যাচ্ছে না! Render সার্ভিসটি চালু আছে কি না নিশ্চিত করুন।");
    } finally {
        btn.innerText = "SIGN UP";
        btn.disabled = false;
    }
}
</script>

</body>
</html>
